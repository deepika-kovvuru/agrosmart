name: Validation Tests (300)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validation-suite:
    name: Validation Tests (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Validation Test Suite (300 Cases)
        run: |
          python tests/validation/run_validation_tests.py
          python tests/make_excel.py

      - name: Upload Validation Report Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: validation-test-report
          path: |
            reports/validation_test_report.json
            reports/validation_test_report.xlsx
