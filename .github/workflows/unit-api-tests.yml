name: Unit Tests — API (300)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  unit-api-suite:
    name: Unit Tests — API (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Run Unit API Test Suite (300 Cases)
        run: |
          python tests/unit_api/run_unit_api_tests.py
          python tests/make_excel.py

      - name: Upload Unit API Report Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            reports/unit_test_report.json
            reports/unit_test_report.xlsx
