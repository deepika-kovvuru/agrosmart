name: Load Testing — Performance (300)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  load-testing-suite:
    name: Load Testing — Performance (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Baseline Load Test Suite (100 VUs / 1 Min Continuous)
        run: |
          python tests/load_performance/run_load_tests.py
          python tests/make_excel.py

      - name: Upload Load Testing Report Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: load-test-report
          path: |
            reports/load_test_report.json
            reports/load_test_report.xlsx
            reports/load_report.html
