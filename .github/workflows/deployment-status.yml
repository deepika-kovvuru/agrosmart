name: Deployment Status (300)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deployment-status-suite:
    name: Deployment Status (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Deployment Status Verification Suite (300 Cases)
        run: |
          python tests/deployment/run_deployment_tests.py
          python tests/make_excel.py

      - name: Upload Deployment Report Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-test-report
          path: |
            reports/deployment_test_report.json
            reports/deployment_test_report.xlsx
